<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Update Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-info text-white">

<h2>Update Account</h2>

</div>

<div class="card-body">

<form action="/update" method="post">

<div class="mb-3">
<label>Account Number</label>
<input type="number"
       name="accountNo"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>Name</label>
<input type="text"
       name="name"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>Mobile</label>
<input type="text"
       name="mobile"
       class="form-control"
       required>
</div>

<div class="mb-3">
<label>Address</label>
<textarea name="address"
          class="form-control"
          required></textarea>
</div>

<button class="btn btn-primary">
Update Account
</button>

<a href="/" class="btn btn-secondary">
Home
</a>

</form>

</div>

</div>

</div>

</body>

</html>
