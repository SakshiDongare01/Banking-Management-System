<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Create Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center text-primary">
Create New Account
</h2>

<hr>

<form th:action="@{/save}" th:object="${account}" method="post">

<div class="mb-3">
<label>Account Number</label>
<input type="number"
class="form-control"
th:field="*{accountNo}"
required>
</div>

<div class="mb-3">
<label>Name</label>
<input type="text"
class="form-control"
th:field="*{name}"
required>
</div>

<div class="mb-3">
<label>Mobile</label>
<input type="text"
class="form-control"
th:field="*{mobile}"
required>
</div>

<div class="mb-3">
<label>Address</label>
<input type="text"
class="form-control"
th:field="*{address}"
required>
</div>

<div class="mb-3">
<label>Balance</label>
<input type="number"
step="0.01"
class="form-control"
th:field="*{balance}"
required>
</div>

<button type="submit" class="btn btn-success">
Save Account
</button>

<a href="/" class="btn btn-secondary">
Home
</a>

</form>

</div>

</div>

</body>
</html>
