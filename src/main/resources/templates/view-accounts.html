<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>View Accounts</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h2>All Bank Accounts</h2>

</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>
<th>Account No</th>
<th>Name</th>
<th>Mobile</th>
<th>Address</th>
<th>Balance</th>
</tr>

</thead>

<tbody>

<tr th:each="acc : ${accounts}">
<td th:text="${acc.accountNo}"></td>
<td th:text="${acc.name}"></td>
<td th:text="${acc.mobile}"></td>
<td th:text="${acc.address}"></td>
<td th:text="${acc.balance}"></td>
</tr>

</tbody>

</table>

<br>

<a href="/" class="btn btn-secondary">Home</a>

<a href="/create" class="btn btn-success">Create New Account</a>

</div>

</div>

</div>

</body>
</html>
